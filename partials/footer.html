<footer class="hours-band" id="apningstider">
  <svg class="wave" viewBox="0 0 1440 90" preserveAspectRatio="none" aria-hidden="true"><path fill="currentColor" d="M0 60C180 20 360 10 560 34s420 56 620 40 240-50 260-58v74H0Z"/></svg>
  <div class="wrap">
    <div class="hours-grid">
      <div class="hours-title">
        <svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg>
        <div>
          <h2>Åpningstider</h2>
          <div class="now" data-open-status><span class="status-dot"></span><span>Sjekker …</span></div>
        </div>
      </div>
      <dl class="hours-list">
{{HOURS_A}}
      </dl>
      <dl class="hours-list">
{{HOURS_B}}
      </dl>
      <address class="footer-contact" style="font-style:normal">
        <p class="footer-name">Fjellhamar Bistro</p>
        <p class="footer-tagline">Kinesisk restaurant på Fjellhamar i Lørenskog.</p>
        <a href="https://www.google.com/maps/search/?api=1&amp;query={{ADDRESS_Q}}" target="_blank" rel="noopener"><svg class="icon" aria-hidden="true"><use href="#i-pin"/></svg>{{ADDRESS}}, Lørenskog</a>
        <a href="tel:{{TEL}}"><svg class="icon" aria-hidden="true"><use href="#i-phone"/></svg>{{PHONE}}</a>
        <a href="mailto:{{EMAIL}}"><svg class="icon" aria-hidden="true"><use href="#i-mail"/></svg>{{EMAIL}}</a>
      </address>
    </div>
    <div class="footer-bottom">
      <span>© <span data-year>2026</span> Fjellhamar Bistro · Kinesisk, asiatisk og norsk mat</span>
      <span><a href="meny.html#allergener">Allergeninformasjon</a> · <a href="#top">Til toppen ↑</a></span>
    </div>
  </div>
</footer>
